<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Modo claro u oscuro antes del primer pintado: bloquea apenas unos bytes. -->
    <script src="/theme.js"></script>
    <!-- Al construir, scripts/prerender.mjs pone aquí el título, la descripción, la dirección
         canónica, Open Graph y los datos estructurados de cada página, y en la portada la
         precarga de su fotografía. Es lo que leen las redes sociales y los buscadores que no
         ejecutan JavaScript (RF-005). -->
    <!--cabecera-de-la-pagina-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <!-- La fuente de interfaz se precarga desde el mismo origen. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="ALETHEIA" />
    <meta property="og:image" content="https://aletheia.sbs/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aletheia. Su trabajo. Con claridad. Símbolo circular con un ojo y líneas de trazabilidad digital."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- El prerender deja aquí el contenido de la página; React lo reemplaza al arrancar. -->
    <div id="root"><!--contenido-de-la-pagina--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
