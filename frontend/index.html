<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Cada página cambia el título, la descripción y la URL canónica al cargar. Lo que
         sigue lo leen las redes sociales y los buscadores que no ejecutan JavaScript (RF-005). -->
    <title>ALETHEIA | Casos y evidencia de su despacho</title>
    <meta
      name="description"
      content="Organice sus casos y su equipo jurídico. Compruebe huellas SHA-256 en su navegador y explore los fundamentos de la evidencia digital."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <!-- La fotografía de la portada es lo más grande que se pinta al entrar: se pide desde el
         HTML y no cuando React la dibuja, lo que adelanta el contenido más grande de la página. Los
         anchos y el tamaño son los mismos de la imagen del Hero, para que el navegador reutilice
         la descarga. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/media/campaign/hero-real-1280.webp"
      imagesrcset="/media/campaign/hero-real-640.webp 640w, /media/campaign/hero-real-1280.webp 1280w, /media/campaign/hero-real-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- La fuente de interfaz se precarga desde el mismo origen. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="ALETHEIA" />
    <meta property="og:url" content="https://aletheia.sbs/" />
    <meta
      property="og:title"
      content="ALETHEIA | Casos y evidencia de su despacho"
    />
    <meta
      property="og:description"
      content="Organice sus casos y su equipo jurídico. Compruebe huellas SHA-256 en su navegador y explore los fundamentos de la evidencia digital."
    />
    <meta property="og:image" content="https://aletheia.sbs/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aletheia. Su trabajo. Con claridad. Símbolo circular con un ojo y líneas de trazabilidad digital."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
