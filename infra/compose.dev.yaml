# Servicios de apoyo para el desarrollo local.
# El backend y el frontend corren en Windows; aquí solo viven los datos.
name: aletheia-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Desde PostgreSQL 18 el volumen va en /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # Solo el servicio Blob, que es el que usa la aplicación.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck --disableTelemetry
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025" # SMTP: aquí envía el backend
      - "127.0.0.1:8025:8025" # Interfaz web para leer los correos

volumes:
  postgres-data:
  azurite-data:
