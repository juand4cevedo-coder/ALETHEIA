<!-- Maestro de frontend/public/og-image.png: rasterizar a 1200 x 630 px, sin transparencia. Fondo previsto: papel
     (#f4f1ea) a la izquierda y tinta (#071423) a la derecha; cada elemento usa el color que se lee sobre su fondo.
     Los títulos piden Fraunces: instálela en el sistema antes de rasterizar o caerán a Georgia. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect x="800" width="400" height="630" fill="#071423"/>
  <g fill="none" stroke="#c3a572" stroke-width="1" opacity=".55">
    <circle cx="1000" cy="315" r="190"/><circle cx="1000" cy="315" r="150"/>
  </g>
  <g fill="#f4f1ea" transform="translate(1000,315) scale(4.9) translate(-32,-31.5)">
    <path fill-rule="evenodd" d="M22 3 h11 l12 12 v17 a3 3 0 0 1 -3 3 H22 a3 3 0 0 1 -3 -3 V6 a3 3 0 0 1 3 -3 Z M33 3 v9 a3 3 0 0 0 3 3 h9 Z"/>
    <path d="M28.4 35 h7.2 v9 h5.4 v4.8 h-5.4 v3.4 h4.4 v4.8 h-4.4 v3 h-7.2 Z"/>
  </g>
  <g fill="#071423" transform="translate(97,82) scale(0.7) translate(-32,-31.5)">
    <path fill-rule="evenodd" d="M22 3 h11 l12 12 v17 a3 3 0 0 1 -3 3 H22 a3 3 0 0 1 -3 -3 V6 a3 3 0 0 1 3 -3 Z M33 3 v9 a3 3 0 0 0 3 3 h9 Z"/>
    <path d="M28.4 35 h7.2 v9 h5.4 v4.8 h-5.4 v3.4 h4.4 v4.8 h-4.4 v3 h-7.2 Z"/>
  </g>
  <text x="134" y="96" fill="#071423" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="34" font-weight="600">Aletheia</text>
  <text x="82" y="303" fill="#071423" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="84" font-weight="500">Su trabajo.</text>
  <text x="82" y="396" fill="#071423" font-family="Fraunces, 'Iowan Old Style', Georgia, serif" font-size="84" font-weight="500">Con claridad.</text>
  <text x="86" y="466" fill="#49545f" font-family="Inter, Arial, sans-serif" font-size="24">Casos, equipos y contexto en un solo lugar.</text>
  <path d="M82 530H718" stroke="#7e5f36" stroke-width="1"/>
  <text x="82" y="570" fill="#7e5f36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3">ALETHEIA.SBS</text>
</svg>
