<!-- Maestro de frontend/public/favicon.png: rasterizar a 32 x 32 px. Solo las esquinas son transparentes. El PNG no puede
     cambiar con el tema, así que lleva el mosaico de tinta opaco: se lee sobre barras de navegador claras y oscuras. -->
