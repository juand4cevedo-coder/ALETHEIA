name: Sonda externa

# Comprueba desde fuera de AWS que el sitio responde y que el certificado no está por vencer.
# Si falla, abre una incidencia en el repositorio, que llega por correo a quienes lo siguen, y la
# cierra sola cuando el sitio vuelve. Cubre lo que el servidor no puede ver de sí mismo: caída
# total, certificado vencido o DNS roto.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonda-externa
  cancel-in-progress: true

jobs:
  sitio:
    name: El sitio responde
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Salud de la API
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            if cuerpo="$(curl --fail --silent --show-error --max-time 15 https://aletheia.sbs/api/v1/health)" \
               && grep -q '"status":"ok"' <<<"$cuerpo" && grep -q '"database":"ok"' <<<"$cuerpo"; then
              echo "La API y la base responden."
              break
            fi
            if [[ "$intento" == 3 ]]; then
              echo "::error::aletheia.sbs no responde con salud correcta tras 3 intentos."
              exit 1
            fi
            sleep 20
          done
      - name: Página principal y certificado
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --output /dev/null https://aletheia.sbs/
          fin="$(echo | openssl s_client -connect aletheia.sbs:443 -servername aletheia.sbs 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)"
          dias=$(( ( $(date -d "$fin" +%s) - $(date +%s) ) / 86400 ))
          echo "El certificado vence en $dias días."
          if (( dias < 10 )); then
            echo "::error::El certificado de aletheia.sbs vence en menos de 10 días."
            exit 1
          fi
      - name: Abrir incidencia si el sitio falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          abierta="$(gh issue list --state open --label sonda-externa --json number --jq '.[0].number // empty')"
          if [[ -z "$abierta" ]]; then
            gh label create sonda-externa --color B60205 --description "Fallo de la sonda externa" 2>/dev/null || true
            gh issue create --label sonda-externa --title "El sitio no responde: aletheia.sbs" \
              --body "La sonda externa falló. Revise la ejecución: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Esta incidencia se cierra sola cuando el sitio vuelve a responder."
          else
            gh issue comment "$abierta" --body "Sigue fallando: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Cerrar la incidencia si el sitio volvió
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for numero in $(gh issue list --state open --label sonda-externa --json number --jq '.[].number'); do
            gh issue close "$numero" --comment "El sitio volvió a responder."
          done
