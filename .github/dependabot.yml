version: 2

updates:
  # Acciones de GitHub: corren con las credenciales de publicación y despliegue, así que
  # esperan 14 días desde la publicación (ADR-019).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 14
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Bibliotecas de Python: 7 días, la misma espera que aplica uv (ADR-019).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Imágenes base de los Dockerfile. Van fijadas por digest y Dependabot propone el cambio de
  # etiqueta y digest juntos. Esperan 14 días desde la publicación (ADR-019).
  - package-ecosystem: docker
    directories: ["/backend", "/infra"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  # Bibliotecas de JavaScript: 7 días, la misma espera que aplica pnpm (ADR-019).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 7
    groups:
      node:
        patterns: ["*"]
    commit-message:
      prefix: build
