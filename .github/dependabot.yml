version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 3
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Imágenes base de los Dockerfile. Van fijadas por digest y Dependabot propone el cambio de
  # etiqueta y digest juntos. Espera 14 días desde la publicación, como exige ADR-018.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 3
    groups:
      node:
        patterns: ["*"]
    commit-message:
      prefix: build
