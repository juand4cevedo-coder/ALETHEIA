[project]
name = "aletheia-backend"
version = "0.1.0"
description = "API de ALETHEIA: preservación de evidencia digital con integridad y trazabilidad."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
# El backend es una aplicación, no un paquete: uv no lo construye ni lo instala.
package = false

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
