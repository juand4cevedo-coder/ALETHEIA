[project]
name = "aletheia-backend"
version = "0.1.0"
description = "API de ALETHEIA: preservación de evidencia digital con integridad y trazabilidad."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.120",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[tool.uv]
# El backend es una aplicación, no un paquete: uv no lo construye ni lo instala.
package = false
# Misma espera que Dependabot: no se instala nada publicado hace menos de 3 días.
exclude-newer = "3 days"
# Cada `uv add` fija la versión exacta resuelta.
add-bounds = "exact"

[dependency-groups]
dev = [
    "boto3-stubs[ssm]==1.43.120",
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
spike = [
    "asn1crypto==1.5.1",
    "cryptography==50.0.2",
    "psutil==7.2.2",
    "python-multipart==0.0.32",
    "rfc3161-client==1.0.9",
    "tink==1.16.1",
    "types-psutil==7.2.2.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"spikes/**/test_*.py" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tink", "tink.*", "asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
# Permite que las pruebas importen el paquete app desde backend/.
pythonpath = ["."]
# --tb=short: un fallo muestra las líneas del error, no los argumentos, que pueden traer
# la URL de la base con su clave.
addopts = ["-ra", "--strict-config", "--strict-markers", "--tb=short"]
xfail_strict = true


[tool.alembic]
script_location = "%(here)s/migrations"
# Fecha y hora al inicio del nombre: las migraciones se listan en el orden en que se crearon.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Cada migración nueva sale formateada y corregida con Ruff, igual que el resto del código.
# Primero el formato: así la revisión ya no ve las líneas largas que el formato parte.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
