[project]
name = "aletheia-backend"
version = "0.1.0"
description = "API de ALETHEIA: preservación de evidencia digital con integridad y trazabilidad."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.156.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.54.0",
]

[tool.uv]
# El backend es una aplicación, no un paquete: uv no lo construye ni lo instala.
package = false
# Misma espera que Dependabot: no se instala nada publicado hace menos de 3 días.
exclude-newer = "3 days"
# Cada `uv add` fija la versión exacta resuelta.
add-bounds = "exact"

[dependency-groups]
dev = [
    "httpx2==2.15.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
# Permite que las pruebas importen el paquete app desde backend/.
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true


[tool.alembic]
script_location = "%(here)s/migrations"
# Fecha y hora al inicio del nombre: las migraciones se listan en el orden en que se crearon.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Cada migración nueva sale corregida y formateada con Ruff, igual que el resto del código.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

# Cada migración nueva sale formateada y corregida con Ruff, igual que el resto del código.
# Primero el formato: así la revisión ya no ve las líneas largas que el formato parte.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
