[project]
name = "aletheia-backend"
version = "0.1.0"
description = "API de ALETHEIA: preservación de evidencia digital con integridad y trazabilidad."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.156.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.54.0",
]

[tool.uv]
# El backend es una aplicación, no un paquete: uv no lo construye ni lo instala.
package = false
# Misma espera que Dependabot: no se instala nada publicado hace menos de 3 días.
exclude-newer = "3 days"
# Cada `uv add` fija la versión exacta resuelta.
add-bounds = "exact"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
# Permite que las pruebas importen el paquete app desde backend/.
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
